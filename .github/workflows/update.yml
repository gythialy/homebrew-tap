name: Update casks

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Refresh the casks from upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py

      - name: Open or refresh the update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git diff --quiet -- Casks; then
            echo "casks are current"
            exit 0
          fi
          branch="chore/update-casks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Casks
          title=$(python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--", "Casks"],
              text=True,
          ).splitlines()
          updates = []
          for name in files:
              path = Path(name)
              match = re.search(r'^  version "([^"]+)"$', path.read_text(), re.MULTILINE)
              updates.append((path.stem, match.group(1) if match else None))

          if len(updates) == 1:
              token, version = updates[0]
              print(f"Update {token} cask to {version}" if version else f"Update {token} cask")
          elif updates:
              tokens = ", ".join(token for token, _ in updates)
              print(f"Update {tokens} casks")
          else:
              print("Update casks")
          PY
          )
          git commit -m "$title"
          git push --force origin "$branch"
          state=$(gh pr view "$branch" --json state -q .state 2>/dev/null || true)
          body="Automated cask refresh from upstream releases."
          if [ "$state" = OPEN ]; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "$title" \
              --body "$body"
          fi
          gh pr merge --auto --squash "$branch"
